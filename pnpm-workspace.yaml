packages:
  - "apps/*"
  - "packages/*"

minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true

# Prisma 7.10.0 (latest stable Prisma 7) still pins these vulnerable CLI-only
# transitive dependencies. Keep the exceptions narrow so any other high/critical
# advisory continues to fail CI. Remove them when a stable Prisma release fixes
# the dependency chain.
auditConfig:
  ignoreGhsas:
    - GHSA-ggr8-5vv4-36mx # @prisma/config -> deepmerge-ts <8
    - GHSA-3f6p-5ww8-9rcr # prisma CLI -> mysql2 <3.22; app runtime uses PostgreSQL

onlyBuiltDependencies:
  - "@prisma/engines"
  - "argon2"
  - "esbuild"
  - "prisma"
