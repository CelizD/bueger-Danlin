packages:
  - "apps/*"
  - "packages/*"

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "next@16.3.8"
  - "deepmerge-ts@8.0.2"
  - "mysql2@3.24.4"
trustPolicy: no-downgrade
blockExoticSubdeps: true

overrides:
  deepmerge-ts: 8.0.2
  mysql2: 3.24.4


onlyBuiltDependencies:
  - "@prisma/engines"
  - "argon2"
  - "esbuild"
  - "prisma"
