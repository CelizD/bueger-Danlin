name: burger-danlin-prod

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
    volumes:
      - burger_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    shm_size: 256mb
    networks:
      - data
    logging:
      driver: json-file
      options:
        tag: "postgres"
        max-size: "10m"
        max-file: "5"

  db-bootstrap:
    image: postgres:18-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:?POSTGRES_RUNTIME_USER is required}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}
    volumes:
      - ./deploy/postgres/bootstrap-runtime.sh:/usr/local/bin/bootstrap-runtime.sh:ro
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    command:
      - /bin/sh
      - /usr/local/bin/bootstrap-runtime.sh

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      [
        "sh",
        "-c",
        "exec redis-server --appendonly no --save '' --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\"",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - data
    logging:
      driver: json-file
      options:
        tag: "redis"
        max-size: "10m"
        max-file: "5"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      API_PORT: 4000
      API_PREFIX: api/v1
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Tijuana}
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
      FORCE_HTTPS: "true"
      ENABLE_API_DOCS: "false"
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-256kb}
      URLENCODED_BODY_LIMIT: ${URLENCODED_BODY_LIMIT:-64kb}
      DATABASE_URL: postgresql://${POSTGRES_RUNTIME_USER:?POSTGRES_RUNTIME_USER is required}:${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:?PAYMENT_PROVIDER is required}
      ENABLE_REAL_PAYMENTS: ${ENABLE_REAL_PAYMENTS:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      QR_TOKEN_SECRET: ${QR_TOKEN_SECRET:?QR_TOKEN_SECRET is required}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY is required}
      TELEGRAM_NOTIFICATIONS_ENABLED: ${TELEGRAM_NOTIFICATIONS_ENABLED:-false}
      TELEGRAM_NOTIFY_NEW_ORDER: ${TELEGRAM_NOTIFY_NEW_ORDER:-true}
      TELEGRAM_NOTIFY_PAYMENT: ${TELEGRAM_NOTIFY_PAYMENT:-true}
      TELEGRAM_NOTIFY_PREPARING: ${TELEGRAM_NOTIFY_PREPARING:-false}
      TELEGRAM_NOTIFY_READY: ${TELEGRAM_NOTIFY_READY:-true}
      TELEGRAM_NOTIFY_DELIVERED: ${TELEGRAM_NOTIFY_DELIVERED:-true}
      TELEGRAM_NOTIFY_CANCELLED: ${TELEGRAM_NOTIFY_CANCELLED:-true}
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram-bot-token
      TELEGRAM_CHAT_ID_FILE: /run/secrets/telegram-chat-id
    volumes:
      - ${TELEGRAM_BOT_TOKEN_FILE:-/dev/null}:/run/secrets/telegram-bot-token:ro
      - ${TELEGRAM_CHAT_ID_FILE:-/dev/null}:/run/secrets/telegram-chat-id:ro
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - app
      - data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      driver: json-file
      options:
        tag: "api"
        max-size: "20m"
        max-file: "5"

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles:
      - ops
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}:${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    working_dir: /app
    command:
      - node
      - node_modules/prisma/build/index.js
      - migrate
      - deploy



  retention-cleanup:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles:
      - ops
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_RUNTIME_USER:?POSTGRES_RUNTIME_USER is required}:${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      RETENTION_CLEANUP_ENABLED: ${RETENTION_CLEANUP_ENABLED:-false}
      RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-200}
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    working_dir: /app/apps/api
    command:
      - node
      - dist/scripts/retention-cleanup.js
      - --apply


  group-delivery-settlement:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles:
      - ops
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_RUNTIME_USER:?POSTGRES_RUNTIME_USER is required}:${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    working_dir: /app/apps/api
    command:
      - node
      - dist/scripts/settle-group-deliveries.js

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - app
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        tag: "web"
        max-size: "20m"
        max-file: "5"

  backup:
    image: burger-danlin-backup:local
    build:
      context: .
      dockerfile: deploy/backup/Dockerfile
    profiles:
      - ops
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}:${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?BACKUP_AGE_RECIPIENT is required}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-burger-danlin}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backup-cycle:
    image: burger-danlin-backup:local
    profiles:
      - ops
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}:${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?BACKUP_AGE_RECIPIENT is required}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-burger-danlin}
      OFFSITE_BACKUP_ENABLED: ${OFFSITE_BACKUP_ENABLED:-false}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${S3_REGION:-de}
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
      AWS_CLI_AUTO_PROMPT: "off"
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-burger-danlin/postgres}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    networks:
      - data
      - offsite
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - /opt/backup/backup-cycle.sh

  offsite-upload:
    image: burger-danlin-backup:local
    profiles:
      - ops
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${S3_REGION:-de}
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
      AWS_CLI_AUTO_PROMPT: "off"
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-burger-danlin/postgres}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-burger-danlin}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups:ro
    networks:
      - offsite
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    command:
      - /opt/backup/offsite-upload.sh

  offsite-fetch:
    image: burger-danlin-backup:local
    profiles:
      - dr
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${S3_REGION:-de}
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
      AWS_CLI_AUTO_PROMPT: "off"
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-burger-danlin/postgres}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-burger-danlin}
      OFFSITE_BACKUP_KEY: ${OFFSITE_BACKUP_KEY:-}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    networks:
      - offsite
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - /opt/backup/offsite-fetch-latest.sh

  restore-postgres:
    image: postgres:18-alpine
    profiles:
      - dr
    environment:
      POSTGRES_DB: restore_drill
      POSTGRES_USER: restore_drill
      POSTGRES_PASSWORD: restore_drill_only
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U restore_drill -d restore_drill",
        ]
      interval: 3s
      timeout: 3s
      retries: 15
    networks:
      - restore

  restore-drill:
    image: burger-danlin-backup:local
    profiles:
      - dr
    depends_on:
      restore-postgres:
        condition: service_healthy
    environment:
      RESTORE_DATABASE_URL: postgresql://restore_drill:restore_drill_only@restore-postgres:5432/restore_drill
      BACKUP_FILE: ${BACKUP_FILE:-}
      BACKUP_AGE_IDENTITY: /run/secrets/backup-age.key
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups:ro
      - ${BACKUP_AGE_IDENTITY_FILE:-/etc/burger-danlin/backup-age.key}:/run/secrets/backup-age.key:ro
    networks:
      - restore
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - /opt/backup/restore-drill.sh


  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    profiles:
      - observability
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - burger_prometheus_data:/prometheus
    networks:
      - app
      - observability
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    logging:
      driver: json-file
      options:
        tag: "prometheus"
        max-size: "10m"
        max-file: "3"


  alertmanager:
    image: prom/alertmanager:v0.34.1
    restart: unless-stopped
    profiles:
      - telegram-alerts
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./deploy/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${TELEGRAM_BOT_TOKEN_FILE:-/dev/null}:/run/secrets/telegram-bot-token:ro
      - ${TELEGRAM_CHAT_ID_FILE:-/dev/null}:/run/secrets/telegram-chat-id:ro
      - burger_alertmanager_data:/alertmanager
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    logging:
      driver: json-file
      options:
        tag: "alertmanager"
        max-size: "10m"
        max-file: "3"

  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    profiles:
      - observability
    command:
      - -config.file=/etc/loki/config.yml
    volumes:
      - ./deploy/observability/loki/loki.yml:/etc/loki/config.yml:ro
      - burger_loki_data:/loki
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    logging:
      driver: json-file
      options:
        tag: "loki"
        max-size: "10m"
        max-file: "3"

  alloy:
    image: grafana/alloy:v1.20.0
    restart: unless-stopped
    profiles:
      - observability
    depends_on:
      - loki
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    volumes:
      - ./deploy/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - burger_alloy_data:/var/lib/alloy/data
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    logging:
      driver: json-file
      options:
        tag: "alloy"
        max-size: "10m"
        max-file: "3"

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    profiles:
      - observability
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    logging:
      driver: json-file
      options:
        tag: "node-exporter"
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    profiles:
      - observability
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_MODE: console
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - burger_grafana_data:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      driver: json-file
      options:
        tag: "grafana"
        max-size: "10m"
        max-file: "3"

volumes:
  burger_postgres_data:
  burger_prometheus_data:
  burger_alertmanager_data:
  burger_loki_data:
  burger_alloy_data:
  burger_grafana_data:

networks:
  app:
  observability:
  offsite:
  data:
    internal: true
  restore:
    internal: true
