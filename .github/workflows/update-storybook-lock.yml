name: Update Storybook lockfile

on:
  push:
    branches:
      - feat/storybook-design-system

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/storybook-design-system

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Update lockfile
        run: |
          printf "\ntrustPolicyExclude:\n  - 'prisma@7.10.0'\n" >> pnpm-workspace.yaml
          pnpm install --lockfile-only --no-frozen-lockfile
          git checkout -- pnpm-workspace.yaml

      - name: Commit lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "feat: update lockfile for Storybook"
          git push
