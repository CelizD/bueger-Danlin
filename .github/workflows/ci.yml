name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: burger_danlin_test
          POSTGRES_USER: burger_test
          POSTGRES_PASSWORD: burger_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U burger_test -d burger_danlin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://burger_test:burger_test_password@localhost:5432/burger_danlin_test?schema=public
      QR_TOKEN_SECRET: ci-only-qr-token-secret-not-used-in-production-123456789
      AUTH_JWT_SECRET: ci-only-auth-jwt-secret-not-used-in-production-123456789
      PAYMENT_PROVIDER: mock
      ENABLE_REAL_PAYMENTS: "false"
      APP_TIMEZONE: America/Tijuana
      E2E_ADMIN_PASSWORD: ci-only-admin-e2e-passphrase-2026
      E2E_KITCHEN_PASSWORD: ci-only-kitchen-e2e-passphrase-2026
      E2E_DELIVERY_PASSWORD: ci-only-delivery-e2e-passphrase-2026
      BUSINESS_LEGAL_NAME: Burger Danlin E2E
      BUSINESS_TRADE_NAME: Burger Danlin
      BUSINESS_RFC: BDE260101AB1
      BUSINESS_ADDRESS: Avenida Pruebas 123, Tijuana, BC
      SUPPORT_PHONE: +52 664 555 0100
      SUPPORT_EMAIL: soporte.e2e@example.test
      EMAIL_NOTIFICATIONS_ENABLED: "true"
      MAIL_HOST: localhost
      MAIL_PORT: "1025"
      MAIL_SECURITY: none
      MAIL_FROM: Burger Danlin <no-reply@burger-danlin.test>
      MAIL_REPLY_TO: soporte.e2e@example.test
      MAIL_REJECT_UNAUTHORIZED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate E2E MFA key
        run: |
          node -e "process.stdout.write('MFA_ENCRYPTION_KEY=' + require('node:crypto').randomBytes(32).toString('base64url') + '\n')" >> "$GITHUB_ENV"

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm db:migrate:deploy

      - name: Typecheck
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build Storybook
        run: pnpm --filter @burger/web build-storybook

      - name: Seed integrated E2E data
        run: |
          pnpm db:seed
          pnpm db:seed:e2e

      - name: Install Playwright Chromium
        run: pnpm --filter @burger/web exec playwright install --with-deps chromium

      - name: Integrated E2E
        run: pnpm --filter @burger/web test:e2e:integration
