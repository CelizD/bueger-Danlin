name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: burger_danlin_test
          POSTGRES_USER: burger_test
          POSTGRES_PASSWORD: burger_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U burger_test -d burger_danlin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://burger_test:burger_test_password@localhost:5432/burger_danlin_test?schema=public
      QR_TOKEN_SECRET: ci-only-qr-token-secret-not-used-in-production-123456789
      AUTH_JWT_SECRET: ci-only-auth-jwt-secret-not-used-in-production-123456789
      PAYMENT_PROVIDER: mock
      APP_TIMEZONE: America/Tijuana

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
       uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.17.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm db:migrate:deploy

      - name: Typecheck
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
