route:
  receiver: telegram
  group_by:
    - alertname
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: telegram
    telegram_configs:
      - send_resolved: true
        bot_token_file: /run/secrets/telegram-bot-token
        chat_id_file: /run/secrets/telegram-chat-id
        parse_mode: ""
        message: |-
          {{ if eq .Status "firing" }}🚨 ALERTA{{ else }}✅ RESUELTA{{ end }}
          {{ range .Alerts }}
          {{ .Labels.alertname }} [{{ .Labels.severity }}]
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
